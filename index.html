<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Barrial</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1> Biblioteca Barrial</h1>
        <p class="sub">Sistema de gestión de catálogo y préstamos</p>
    </header>

    <div class="layout">
        <!-- SECCIÓN IZQUIERDA: lista de secciones -->
        <aside class="sidebar">
            <h2>Secciones</h2>
            <ul id="menu">
                <li data-view="libros" class="active"> Libros</li>
                <li data-view="ejemplares"> Ejemplares</li>
                <li data-view="socios"> Socios</li>
                <li data-view="prestamos"> Préstamos</li>
            </ul>
            <div class="status" id="status">Listo.</div>
        </aside>

        <!-- SECCIÓN DERECHA: contenido -->
        <main class="content">
            <div id="view-container"></div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
